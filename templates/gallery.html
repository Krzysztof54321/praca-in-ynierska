<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Photos Lite</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/css/lightgallery-bundle.min.css">

    <style>

        body{
            background:#f5f7fb;
        }

        .navbar{
            background:white;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
        }

        .gallery-image{
            width:100%;
            height:250px;
            object-fit:cover;
            border-radius:12px;
            transition:all .2s ease;
            cursor:pointer;
        }

        .gallery-image:hover{
            transform:scale(1.03);
        }

        .gallery-title{
            font-weight:700;
        }

    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">

        <span class="navbar-brand fw-bold">
            📷 Google Photos Lite
        </span>

        <input
            type="text"
            class="form-control"
            style="max-width:400px"
            placeholder="Szukaj zdjęć...">

    </div>
</nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="gallery-title">
            Wszystkie zdjęcia
        </h2>

        <button class="btn btn-primary">
            Dodaj zdjęcie
        </button>

    </div>

    <div id="gallery" class="row g-4">

        {% for image in images %}

        <div class="col-sm-6 col-md-4 col-lg-3">

            <a
                href="{{ url_for('static', filename='img/' + image) }}"
                data-src="{{ url_for('static', filename='img/' + image) }}">

                <img
                    src="{{ url_for('static', filename='img/' + image) }}"
                    class="gallery-image shadow-sm"
                    alt="{{ image }}">

            </a>

        </div>

        {% endfor %}

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/lightgallery.min.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function () {

    lightGallery(
        document.getElementById("gallery"),
        {
            selector: 'a',
            speed: 400,
            download: false,
            counter: true
        }
    );

});

</script>

</body>
</html>
